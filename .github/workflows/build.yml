name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [claude/zen-ramanujan-9u94tw, main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        shell: pwsh
        continue-on-error: true
        run: python -m unittest discover -s tests -t . -v 2>&1 | Tee-Object -FilePath test-log.txt

      - name: Real scan on the Windows runner (smoke test of the PowerShell scripts)
        shell: pwsh
        continue-on-error: true
        run: python -m usb_fixer --scan 2>&1 | Tee-Object -FilePath scan-report.txt

      - name: Build exe
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          python -m PyInstaller --noconfirm --onefile --windowed --name USB-Fixer --uac-admin --add-data "usb_fixer\data\knowledge.json;usb_fixer\data" run_usb_fixer.py

      - name: Smoke test the built exe (console scan)
        shell: pwsh
        continue-on-error: true
        run: |
          dist\USB-Fixer.exe --scan | Out-File -Encoding utf8 exe-scan.txt
          Get-Content exe-scan.txt -TotalCount 15

      - uses: actions/upload-artifact@v4
        with:
          name: USB-Fixer-windows
          path: |
            dist/USB-Fixer.exe
            test-log.txt
            scan-report.txt
            exe-scan.txt
